# docker compose up --build
# Frontend: http://localhost:${FRONTEND_PORT:-8081}   API: http://localhost:${BACKEND_PORT:-5000}
# Copy .env.example to .env (next to this file) to override the values below.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/socialMediaDB
      # Origin(s) the browser loads the frontend from (comma-separated); add your LAN/public URL when deploying
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-8081}}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env or the shell}"
      UPLOADS_DIR: /data/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ./Frontend
      args:
        # Must be the URL the BROWSER uses to reach the backend
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mongo-data:
  uploads:
